# SPDX-License-Identifier: GPL-3.0-or-later
name: TestFlight

# Signed iPhone build for TestFlight (iphone-public-release-2026-08-11#D-017:
# device acceptance runs on a real iPhone through TestFlight). Dispatch only:
# every run consumes an App Store build number and Apple processing time.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number (default = this workflow's run number)
        type: string
        default: ''
      upload:
        description: Upload the signed IPA to App Store Connect / TestFlight
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  testflight:
    name: Signed iPhone build for TestFlight (iOS 26 SDK)
    runs-on: macos-26
    timeout-minutes: 90
    # Signing material lives in $RUNNER_TEMP/papercup-signing (the helper's
    # default); the runner context is not available to job-level env.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bash tools/build-scripts/ios-ci-signing.sh require-secrets

      - name: Resolve build number
        id: build-number
        shell: bash
        env:
          REQUESTED: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          number="${REQUESTED:-$RUN_NUMBER}"
          [[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo "ERROR: build number must be a positive integer, got: $number" >&2; exit 1; }
          echo "value=$number" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned token-kit revision
        id: token-kit-ref
        shell: bash
        run: |
          token_kit_sha="$(git rev-parse HEAD:libs/token-kit)"
          [[ "$token_kit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$token_kit_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout token-kit
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TOKEN_KIT_REPOSITORY }}
          ref: ${{ steps.token-kit-ref.outputs.sha }}
          ssh-key: ${{ secrets.TOKEN_KIT_DEPLOY_KEY }}
          path: libs/token-kit
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: |
          npm ci
          brew install xcodegen swiftformat

      - name: Install signing identity, profile and App Store Connect key
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bash tools/build-scripts/ios-ci-signing.sh install

      - name: Archive and export signed IPA
        env:
          PAPERCUP_BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
          PAPERCUP_RELEASE_RUN_ID: ${{ github.run_id }}
          PAPERCUP_RELEASE_DIR: ${{ runner.temp }}/papercup-release
        run: tools/build-scripts/release-ios.sh export

      - name: Validate signed archive against the release contract
        env:
          PAPERCUP_RELEASE_DIR: ${{ runner.temp }}/papercup-release
          BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
        run: |
          python3 tools/build-scripts/validate-ios-archive.py \
            "$PAPERCUP_RELEASE_DIR/Papercusp.xcarchive" \
            --source-sha "$(git rev-parse HEAD)" --build "$BUILD_NUMBER" --require-signed \
            --manifest "$PAPERCUP_RELEASE_DIR/candidate-manifest.json"

      - name: Upload to App Store Connect (TestFlight)
        if: inputs.upload
        env:
          PAPERCUP_RELEASE_DIR: ${{ runner.temp }}/papercup-release
        run: |
          set -euo pipefail
          ipa="$(find "$PAPERCUP_RELEASE_DIR/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$ipa"
          PAPERCUP_IPA_PATH="$ipa" tools/build-scripts/release-ios.sh upload

      - name: Record build provenance
        if: always()
        env:
          PAPERCUP_RELEASE_DIR: ${{ runner.temp }}/papercup-release
          BUILD_NUMBER: ${{ steps.build-number.outputs.value }}
        run: |
          mkdir -p "$PAPERCUP_RELEASE_DIR"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "build_number=$BUILD_NUMBER"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "ios_sdk=$(xcrun --sdk iphoneos --show-sdk-version)"
          } > "$PAPERCUP_RELEASE_DIR/provenance.txt"

      - name: Retain signed IPA and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-${{ steps.build-number.outputs.value }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/papercup-release/provenance.txt
            ${{ runner.temp }}/papercup-release/candidate-manifest.json
            ${{ runner.temp }}/papercup-release/export/*.ipa
            ${{ runner.temp }}/papercup-release/ExportOptions.manual.plist
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: bash tools/build-scripts/ios-ci-signing.sh cleanup
