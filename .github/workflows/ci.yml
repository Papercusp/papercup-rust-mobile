# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace (Linux)
    runs-on: ubuntu-latest
    # macos-latest was dropped from the matrix after run 25648261681
    # aborted in 11s with no steps — consistent with hitting the
    # Actions monthly spend cap (macOS runners bill at 10x). The Rust
    # core has no platform-specific glue; iOS-side compile is covered
    # by the Mac VM in OSX-KVM via ssh-driven xcodebuild.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

  uniffi-bindings:
    name: UniFFI bindings (Linux)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate Kotlin bindings
        run: |
          cargo run --quiet --bin uniffi-bindgen -- generate \
            crates/papercup-bindings/src/papercup.udl \
            --language kotlin \
            --out-dir /tmp/kt-out
          test -f /tmp/kt-out/uniffi/papercup/papercup.kt

      - name: Generate Swift bindings
        run: |
          cargo run --quiet --bin uniffi-bindgen -- generate \
            crates/papercup-bindings/src/papercup.udl \
            --language swift \
            --out-dir /tmp/sw-out
          test -f /tmp/sw-out/papercup.swift
