name: CI

# Native CI is admitted again (current macOS26 run 36843022700 passed).
# Managed git-sync commits use [skip ci], so workflow_dispatch remains the
# explicit release-candidate route even with normal push/PR coverage enabled.
on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Run the complete Android gate without rerunning the iPhone gate
        type: boolean
        default: false
      paired_ui:
        description: Execute sanitized paired UI using a fresh one-use PAPERCUP_PAIR_PAYLOAD secret
        type: boolean
        default: false
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # git-sync intentionally stamps [skip ci]. Scheduled runs are independent
  # of that marker; exact-content success caching avoids idle native rebuilds.
  schedule:
    - cron: '17,47 * * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust workspace (Linux)
    if: github.event_name != 'schedule' && inputs.android_only != true
    runs-on: ubuntu-latest
    # macos-latest was dropped from the matrix after run 25648261681
    # aborted in 11s with no steps — consistent with hitting the
    # Actions monthly spend cap (macOS runners bill at 10x). The Rust
    # core has no platform-specific glue; iOS-side compile is covered
    # by the Mac VM in OSX-KVM via ssh-driven xcodebuild.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: Native test result guard regressions
        run: make test-ios-template-runner

  uniffi-bindings:
    name: UniFFI bindings (Linux)
    if: github.event_name != 'schedule' && inputs.android_only != true
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Generate Kotlin bindings
        run: |
          cargo run --quiet --bin uniffi-bindgen -- generate \
            crates/papercup-bindings/src/papercup.udl \
            --language kotlin \
            --out-dir /tmp/kt-out
          test -f /tmp/kt-out/uniffi/papercup/papercup.kt

      - name: Generate Swift bindings
        run: |
          cargo run --quiet --bin uniffi-bindgen -- generate \
            crates/papercup-bindings/src/papercup.udl \
            --language swift \
            --out-dir /tmp/sw-out
          test -f /tmp/sw-out/papercup.swift

  android:
    name: Android API 36 / 16 KB verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: android-check-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute fresh verification window
        id: window
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          mkdir -p android-ci-attempt
          git rev-parse HEAD > android-ci-attempt/source-sha.txt
          printf '%s\n' "$GITHUB_EVENT_NAME" > android-ci-attempt/event.txt
          date -u +%FT%TZ > android-ci-attempt/started-at.txt

      - name: Restore exact-content native success proof
        id: android-proof
        uses: actions/cache/restore@v4
        with:
          path: android-ci-proof
          key: android-api36-16k-v1-${{ runner.os }}-${{ steps.window.outputs.week }}-${{ hashFiles('android/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', 'tools/**', 'Makefile', 'checks-config.json', 'design-tokens/**', 'package.json', 'package-lock.json', 'libs/token-kit/**', '.github/workflows/ci.yml') }}

      - uses: actions/setup-java@v4
        if: steps.android-proof.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        if: steps.android-proof.outputs.cache-hit != 'true'
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.android-proof.outputs.cache-hit != 'true'

      - uses: actions/setup-node@v4
        if: steps.android-proof.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3
        if: steps.android-proof.outputs.cache-hit != 'true'
        with:
          # v3 defaults to the retired 'tools' package; the maintained SDK
          # manager cannot install it. Command-line tools are set up by the
          # action itself, and platform/build/NDK versions are pinned below.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android build tools
        if: steps.android-proof.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
          bash tools/run-android-checks.sh prepare-ci
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          sdkmanager 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'system-images;android-36;google_apis_ps16k;x86_64'
          bash tools/run-android-checks.sh verify-emulator
          cargo install cargo-ndk --locked --version 4.1.2

      - name: Run Rust, bindings, ABI, alignment, unit, lint and privacy checks
        if: steps.android-proof.outputs.cache-hit != 'true'
        env:
          PAPERCUP_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.PAPERCUP_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$PAPERCUP_ANDROID_GOOGLE_SERVICES_JSON" || {
            echo 'The existing Android Firebase app configuration is required.' >&2
            exit 1
          }
          printf '%s' "$PAPERCUP_ANDROID_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          make check-android-host

      - name: Prepare verified artifacts and native runtime working set
        if: steps.android-proof.outputs.cache-hit != 'true'
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android-ci-attempt/apk-sha256.txt
          bash tools/run-android-checks.sh prepare-ci
          bash tools/run-android-checks.sh verify-emulator

      - name: Enable KVM for the native test runtime
        if: steps.android-proof.outputs.cache-hit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute native instrumentation on API 36 with 16 KB pages
        if: steps.android-proof.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash tools/run-android-checks.sh connected

      - name: Bind successful proof to tested source and tools
        if: steps.android-proof.outputs.cache-hit != 'true'
        run: |
          mkdir -p android-ci-proof
          git rev-parse HEAD > android-ci-proof/source-sha.txt
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk > android-ci-proof/apk-sha256.txt
          java -version 2> android-ci-proof/java-version.txt
          rustc -Vv > android-ci-proof/rust-version.txt
          "$ANDROID_HOME/emulator/emulator" -version > android-ci-proof/emulator-version.txt
          cp -r android/app/build/test-results android-ci-proof/unit-results
          cp -r android/app/build/outputs/androidTest-results android-ci-proof/native-results
          cp android/app/build/reports/lint-results-release.* android-ci-proof/

      - name: Cache only a completely successful native verification
        if: success() && steps.android-proof.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android-ci-proof
          key: ${{ steps.android-proof.outputs.cache-primary-key }}

      - name: Retain native proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            android-ci-attempt
            android-ci-proof
            android/app/build/reports
            android/app/build/test-results
            android/app/build/outputs/androidTest-results

  ios:
    name: iPhone release gate (iOS 26 SDK)
    if: github.event_name != 'schedule' && inputs.android_only != true
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve pinned token-kit revision
        id: token-kit-ref
        shell: bash
        run: |
          token_kit_sha="$(git rev-parse HEAD:libs/token-kit)"
          [[ "$token_kit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$token_kit_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout token-kit
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TOKEN_KIT_REPOSITORY }}
          ref: ${{ steps.token-kit-ref.outputs.sha }}
          ssh-key: ${{ secrets.TOKEN_KIT_DEPLOY_KEY }}
          path: libs/token-kit
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: |
          npm ci
          brew install xcodegen swiftformat

      - name: Build iOS core and Xcode project
        run: make build-ios

      - name: Test iOS app
        run: |
          sim_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$sim_udid"
          PAPERCUP_IOS_SIM_UDID="$sim_udid" make test-ios

      - name: Verify release contract and current SDK
        run: |
          make test-ios-release
          tools/build-scripts/verify-ios-release.sh --require-current-sdk

      - name: Clean-install pairing UI smoke
        run: |
          set -euo pipefail
          sim_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$sim_udid"
          xcodebuild test-without-building \
            -project ios/Papercup.xcodeproj -scheme Papercup \
            -destination "platform=iOS Simulator,id=$sim_udid" \
            -derivedDataPath ios/build/dd \
            -only-testing:PapercupUITests/PairFlowUITests/testFreshLaunchShowsPairChoices \
            -resultBundlePath ios/build/ci-pair-smoke.xcresult
          xcrun xcresulttool get test-results summary \
            --path ios/build/ci-pair-smoke.xcresult --format json > ios/build/ci-pair-smoke-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('ios/build/ci-pair-smoke-summary.json').read_text())
          assert result['passedTests'] == 1, result
          assert result['failedTests'] == 0, result
          assert result['skippedTests'] == 0, result
          PY

      - name: Sanitized paired UI capture
        if: ${{ inputs.paired_ui }}
        env:
          TEST_RUNNER_PAPERCUP_PAIR_PAYLOAD: ${{ secrets.PAPERCUP_PAIR_PAYLOAD }}
        run: |
          set -euo pipefail
          test -n "$TEST_RUNNER_PAPERCUP_PAIR_PAYLOAD" || {
            echo 'A fresh sanitized pairing payload is required for paired_ui' >&2
            exit 1
          }
          sim_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "$sim_udid"
          xcodebuild test-without-building \
            -project ios/Papercup.xcodeproj -scheme Papercup \
            -destination "platform=iOS Simulator,id=$sim_udid" \
            -derivedDataPath ios/build/dd \
            -only-testing:PapercupUITests/PairFlowUITests/testPairAndPairedNavigation \
            -resultBundlePath ios/build/ci-paired-ui.xcresult
          xcrun xcresulttool get test-results summary \
            --path ios/build/ci-paired-ui.xcresult --format json > ios/build/ci-paired-ui-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('ios/build/ci-paired-ui-summary.json').read_text())
          assert result['passedTests'] == 1, result
          assert result['failedTests'] == 0, result
          assert result['skippedTests'] == 0, result
          PY

      - name: Archive unsigned release candidate
        run: |
          set -euo pipefail
          xcodebuild archive -project ios/Papercup.xcodeproj -scheme Papercup \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath ios/build/ci-release/Papercusp.xcarchive CODE_SIGNING_ALLOWED=NO
          test -f ios/build/ci-release/Papercusp.xcarchive/Info.plist
          git rev-parse HEAD > ios/build/ci-release/source-sha.txt
          xcodebuild -version > ios/build/ci-release/xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version > ios/build/ci-release/ios-sdk.txt

      - name: Export candidate UI screenshots
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments \
            --path ios/build/ci-pair-smoke.xcresult \
            --output-path ios/build/ci-release/ui-attachments
          if [ -d ios/build/ci-paired-ui.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path ios/build/ci-paired-ui.xcresult \
              --output-path ios/build/ci-release/paired-ui-attachments
          fi
          python3 - <<'PY'
          from pathlib import Path
          screenshots = list(Path('ios/build/ci-release/ui-attachments').rglob('*.png'))
          assert screenshots, 'The clean-install UI test must retain a real candidate screenshot'
          PY

      - name: Retain native candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-native-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ios/build/ci-release
            ios/build/ci-pair-smoke.xcresult
            ios/build/ci-pair-smoke-summary.json
            ios/build/ci-paired-ui.xcresult
            ios/build/ci-paired-ui-summary.json

  design-tokens:
    name: Design tokens drift
    if: github.event_name != 'schedule' && inputs.android_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve pinned token-kit revision
        id: token-kit-ref
        shell: bash
        run: |
          token_kit_sha="$(git rev-parse HEAD:libs/token-kit)"
          [[ "$token_kit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$token_kit_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout token-kit
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.TOKEN_KIT_REPOSITORY }}
          ref: ${{ steps.token-kit-ref.outputs.sha }}
          ssh-key: ${{ secrets.TOKEN_KIT_DEPLOY_KEY }}
          path: libs/token-kit
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.PAPERCUP_REPOSITORY }}
          ssh-key: ${{ secrets.PAPERCUP_DEPLOY_KEY }}
          path: ci/papercup
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Regen + verify clean
        env:
          PAPERCUP_DESIGN_TOKENS_DIR: ${{ github.workspace }}/ci/papercup/design-tokens
          REQUIRE_PRIMITIVES_SOURCE: "1"
        run: npm run tokens:check
