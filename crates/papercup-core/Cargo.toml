[package]
name = "papercup-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust core for the Papercup mobile app: HTTP client, sync state, voice WS, intent parsing. UI-agnostic."

[lib]
name = "papercup_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
reqwest-eventsource = "0.6"
futures-util = { version = "0.3", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets", "getrandom"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
