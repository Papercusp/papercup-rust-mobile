org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Keep Gradle's worker pool bounded on many-core CI hosts while preserving the
# existing heap budget for the combined unit-test and lint gate.
org.gradle.workers.max=4
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Picovoice Porcupine — paste your AccessKey here to enable the
# "hey papercup" wake word. Empty by default; WakeWordEngine treats
# that as "wake word disabled". Get a key at console.picovoice.ai.
PICOVOICE_ACCESS_KEY=

# Fallback: when true, use openWakeWord (TFLite ONNX model bundled in
# assets) instead of Picovoice. Off by default until OWW model lands
# in assets. See WakeWordEngine.kt + docs/VOICE_V1_PLAN.md Phase C.
PAPERCUP_USE_OWW=false
