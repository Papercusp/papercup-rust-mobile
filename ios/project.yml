# XcodeGen spec for the Papercup iOS app.
#
# Run order:
#   1. `make build-ios` from workspace root  (creates PapercupCore.xcframework
#      + ios/PapercupCore/papercup.swift)
#   2. `xcodegen` from this dir              (creates Papercup.xcodeproj)
#   3. `open Papercup.xcodeproj`             (build + run)
#
# The app target compiles the generated `papercup.swift` directly and
# links the xcframework that carries libpapercup.a + the `papercupFFI`
# Clang module the bindings import.

name: Papercup
options:
  bundleIdPrefix: com.papercuspai
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.40.0
  ElevenLabsSDK:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    from: 3.1.4
  # Pin LiveKit (transitive of ElevenLabsSDK) to 2.10.0 — Xcode 16.2's
  # SwiftPM resolver fails to build the LiveKitUniFFI dep introduced
  # in LiveKit 2.11.0 ("no such module 'LiveKitUniFFI'"; the swift
  # wrapper target isn't compiled before LiveKit imports it).
  # 2.10.0 predates the LiveKitUniFFI split and works with Xcode 16.2.
  # elevenlabs-swift-sdk 3.1.4 declares LiveKit 'from: 2.10.0' so this
  # is in-range. Unpin when the Mac VM moves to Xcode 16.3+.
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_CFBundleVersion: "1"
    INFOPLIST_KEY_CFBundleShortVersionString: "0.1.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Papercup/Info.plist

targets:
  Papercup:
    type: application
    platform: iOS
    sources:
      - path: Papercup/Sources
      - path: Papercup/Resources
      - path: PapercupCore/papercup.swift
        compilerFlags:
          - -suppress-warnings
    dependencies:
      - framework: PapercupCore.xcframework
        embed: false
        codeSign: false
      - package: Sentry
      - package: ElevenLabsSDK
        product: ElevenLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papercuspai.operator.mobile
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PapercupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PapercupTests
    dependencies:
      - target: Papercup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papercuspai.operator.mobile.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Papercup.app/Papercup

  PapercupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PapercupUITests
    dependencies:
      - target: Papercup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papercuspai.operator.mobile.uitests
        TEST_TARGET_NAME: Papercup

schemes:
  Papercup:
    build:
      targets:
        Papercup: all
        PapercupTests: [test]
        PapercupUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PapercupTests
        - PapercupUITests
    archive:
      config: Release
