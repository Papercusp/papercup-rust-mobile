# XcodeGen spec for the Papercup iOS app.
#
# Run order:
#   1. `make build-ios` from workspace root  (creates PapercupCore.xcframework
#      + ios/PapercupCore/papercup.swift)
#   2. `xcodegen` from this dir              (creates Papercup.xcodeproj)
#   3. `open Papercup.xcodeproj`             (build + run)
#
# PapercupCore is the generated Swift boundary around the Rust XCFramework.
# The application depends on that module instead of compiling generated
# bindings directly, so app/tests share one checked native seam.

name: Papercup
options:
  bundleIdPrefix: com.papercuspai
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  ElevenLabsSDK:
    url: https://github.com/elevenlabs/elevenlabs-swift-sdk
    from: 3.1.4
  # Picovoice Porcupine for wake-word "hey papercup".
  # Activation steps when AccessKey arrives:
  #   1. Uncomment this block + the dependency entry under Papercup.dependencies
  #   2. Set PICOVOICE_ACCESS_KEY in Papercup/Info.plist
  #   3. (Optional) Drop hey-papercup.ppn into Papercup/Resources/wake-words/
  #   4. Run `make build-ios` — WakeWordEngine.swift activates via canImport(Porcupine)
  # Porcupine:
  #   url: https://github.com/Picovoice/porcupine
  #   from: 3.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Papercup/Info.plist

targets:
  PapercupCore:
    type: framework
    platform: iOS
    sources:
      - path: PapercupCore
        excludes:
          - headers
      - path: PapercupCore/papercup.swift
    dependencies:
      - framework: PapercupCore.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papercuspai.operator.mobile.core
        PRODUCT_MODULE_NAME: PapercupCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)

  Papercup:
    type: application
    platform: iOS
    sources:
      - path: Papercup/Sources
      - path: Papercup/Resources
    dependencies:
      - target: PapercupCore
      - package: ElevenLabsSDK
        product: ElevenLabs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papercuspai.operator.mobile
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Papercup/Papercup.entitlements
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

  PapercupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PapercupTests
    dependencies:
      - target: Papercup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papercuspai.operator.mobile.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Papercup.app/Papercup

  PapercupUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PapercupUITests
    dependencies:
      - target: Papercup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papercuspai.operator.mobile.uitests
        TEST_TARGET_NAME: Papercup

schemes:
  Papercup:
    build:
      targets:
        PapercupCore: all
        Papercup: all
        PapercupTests: [test]
        PapercupUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PapercupTests
        - PapercupUITests
    archive:
      config: Release
